name: Windows portable release

on:
  workflow_dispatch:
    inputs:
      portable_version:
        description: Portable version in x.y.z format
        required: true
        default: 1.5.0
  push:
    tags:
      - "portable-v*"

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Resolve portable version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.portable_version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if (-not $env:GITHUB_REF_NAME.StartsWith("portable-v")) { throw "Unexpected tag: $env:GITHUB_REF_NAME" }
            $version = $env:GITHUB_REF_NAME.Substring(10)
          } else {
            $version = $env:INPUT_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Portable version must use x.y.z format: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify billion-context and native Claude coexist
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "billion-context-fixture"
          npm install --prefix $fixture --ignore-scripts --omit=optional --no-audit --no-fund billion-context@0.1.197
          if ($LASTEXITCODE -ne 0) { throw "Plugin fixture installation failed" }
          $env:PI_WEB_BILLION_CONTEXT_DIR = Join-Path $fixture "node_modules\billion-context"
          npm run test:billion-context
          if ($LASTEXITCODE -ne 0) { throw "Plugin compatibility verification failed" }

      - name: Build portable package
        shell: pwsh
        run: |
          $runtimeDir = Split-Path (Get-Command node.exe).Source
          $outputDir = Join-Path $env:RUNNER_TEMP "Pi-web-portable"
          $archiveDir = Join-Path $env:GITHUB_WORKSPACE "portable\dist"
          & .\scripts\build-portable.ps1 `
            -OutputDir $outputDir `
            -ArchiveDir $archiveDir `
            -RuntimeDir $runtimeDir `
            -Repository $env:GITHUB_REPOSITORY `
            -PortableVersion "${{ steps.version.outputs.version }}"

      - name: Smoke test portable launcher
        shell: pwsh
        run: |
          & .\scripts\test-portable.ps1 -PackageDir (Join-Path $env:RUNNER_TEMP "Pi-web-portable")

      - name: Verify packaged Claude and billion-context tool roundtrip
        shell: pwsh
        run: |
          $env:PI_WEB_BILLION_CONTEXT_DIR = Join-Path $env:RUNNER_TEMP "billion-context-fixture\node_modules\billion-context"
          node scripts/verify-billion-context.mjs --app-dir (Join-Path $env:RUNNER_TEMP "Pi-web-portable\app")
          if ($LASTEXITCODE -ne 0) { throw "Packaged native Claude compatibility verification failed" }

      - name: Verify portable upgrade and data preservation
        shell: pwsh
        run: |
          & .\scripts\test-portable-update.ps1 `
            -PackageDir (Join-Path $env:RUNNER_TEMP "Pi-web-portable") `
            -ArchivePath "portable/dist/pi-web-portable-win-x64.zip" `
            -ChecksumPath "portable/dist/pi-web-portable-win-x64.zip.sha256"

      - name: Verify packaged model selection after failed resends
        shell: pwsh
        run: |
          node scripts/verify-resend-model.mjs (Join-Path $env:RUNNER_TEMP "Pi-web-portable\app")
          if ($LASTEXITCODE -ne 0) { throw "Packaged resend model verification failed" }

      - name: Verify session naming with isolated provider
        shell: pwsh
        run: |
          node scripts/test-session-titles.mjs (Join-Path $env:RUNNER_TEMP "Pi-web-portable")
          if ($LASTEXITCODE -ne 0) { throw "Session naming HTTP verification failed" }

      - name: Build and test single-file executable
        shell: pwsh
        run: |
          & .\scripts\build-portable-exe.ps1
          $exe = Join-Path $env:GITHUB_WORKSPACE "portable\dist\Pi-Web-Portable-win-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "Pi-Web-Portable-single"
          $install = Start-Process -FilePath $exe -ArgumentList @("--install-dir", $installDir, "--install-only", "--non-interactive") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Single-exe install failed: $($install.ExitCode)" }
          $selfTest = Start-Process -FilePath $exe -ArgumentList @("--install-dir", $installDir, "--wait", "--self-test", "--non-interactive") -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Single-exe self-test failed: $($selfTest.ExitCode)" }
          & .\scripts\test-portable.ps1 -PackageDir $installDir -Port 31879

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-portable-win-x64-${{ steps.version.outputs.version }}
          path: |
            portable/dist/pi-web-portable-win-x64.zip
            portable/dist/pi-web-portable-win-x64.zip.sha256
            portable/dist/Pi-Web-Portable-win-x64.exe
            portable/dist/Pi-Web-Portable-win-x64.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "portable/dist/Pi-Web-Portable-win-x64.exe",
            "portable/dist/Pi-Web-Portable-win-x64.exe.sha256",
            "portable/dist/pi-web-portable-win-x64.zip",
            "portable/dist/pi-web-portable-win-x64.zip.sha256"
          )
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" @assets --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" @assets --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "Pi Web Portable ${{ steps.version.outputs.version }}" --notes "Windows x64 便携版。推荐下载单文件 Pi-Web-Portable-win-x64.exe 并双击运行：首次运行安装到 %LOCALAPPDATA%\Pi-Web-Portable，之后直接启动；也可以下载 ZIP 解压后双击 Pi-Web-Portable.exe。启动器会自动检查 portable-v* Release，并在 SHA256 校验通过后更新。"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
