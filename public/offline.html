<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Pi Web is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1a1a1a;
        color: #e8e8e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.6;
      }

      button {
        margin-top: 24px;
        min-height: 40px;
        padding: 0 18px;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        background: #242424;
        color: #e8e8e8;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: #2e2e2e;
      }

      button:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body data-pi-web-offline>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Pi Web is offline</h1>
      <p>Waiting for the local Pi Web server. This page will reconnect automatically.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // The server may recover after a short busy period. Probe the requested
      // page itself so a working API cannot send us into a reload loop.
      let checking = false;
      let retryTimer;
      async function reconnect() {
        if (checking || document.hidden) return;
        checking = true;
        clearTimeout(retryTimer);
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 6000);
        try {
          const response = await fetch(location.href, {
            cache: "no-store",
            signal: controller.signal,
          });
          if (response.ok && response.headers.get("content-type")?.includes("text/html")) {
            const html = await response.text();
            if (!html.includes("data-pi-web-offline")) {
              location.reload();
              return;
            }
          }
        } catch {
          // Keep the manual retry available while the server is offline.
        } finally {
          clearTimeout(timeout);
          checking = false;
          retryTimer = setTimeout(reconnect, 5000);
        }
      }
      window.addEventListener("online", reconnect);
      document.addEventListener("visibilitychange", reconnect);
      retryTimer = setTimeout(reconnect, 2000);
    </script>
  </body>
</html>
